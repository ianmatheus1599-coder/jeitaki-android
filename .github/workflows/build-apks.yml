name: Jeitaki — Compilar 3 APKs
on:
  push:
    branches: [main]
    paths:
      - 'Jeitaki_3_Apps_Android_Projeto_Compilacao.zip'
      - '.github/workflows/build-apks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: APK ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [cliente, profissional, admin]
    defaults:
      run:
        working-directory: source
    env:
      VITE_APP_VARIANT: ${{ matrix.variant }}
      CI: 'true'
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Descompactar projeto
        working-directory: .
        run: |
          mkdir -p source
          unzip -q Jeitaki_3_Apps_Android_Projeto_Compilacao.zip -d extracted
          cp -a extracted/Jeitaki_Android/. source/
          test -f source/package.json
          test -f source/capacitor.config.ts
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # v4 corrige o pacote legado 'tools' removido do repositório Android.
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar plataforma Android
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compatibilizar ferramentas do projeto exportado
        run: |
          npm pkg delete devDependencies.esbuild
          npm pkg set 'devDependencies.typescript=^5.9.3'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar arquivos
        run: npm run check:static
      - name: Escolher icones
        run: |
          cp "assets/versions/$VITE_APP_VARIANT/icon-only.png" assets/icon-only.png
          cp "assets/versions/$VITE_APP_VARIANT/icon-foreground.png" assets/icon-foreground.png
          cp "assets/versions/$VITE_APP_VARIANT/icon-background.png" assets/icon-background.png
          cp "assets/versions/$VITE_APP_VARIANT/splash.png" assets/splash.png
          cp "assets/versions/$VITE_APP_VARIANT/splash-dark.png" assets/splash-dark.png
      - name: Compilar interface
        run: npm run build
      - name: Preparar Android
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
      - name: Compilar APK de teste
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jeitaki-${{ matrix.variant }}-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
